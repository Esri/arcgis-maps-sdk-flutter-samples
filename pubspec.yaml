name: arcgis_maps_sdk_flutter_samples
description: "Sample code demonstrating the capabilities of ArcGIS Maps SDK for Flutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.12.1 <4.0.0'

dependencies:
  app_settings: ^8.0.3
  arcgis_maps: ^300.2.0
  arcgis_maps_toolkit: ^300.2.0
  async: ^2.12.0
  build: ^4.0.7
  build_config: ^1.3.1
  file_picker: 12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_localizations:
    sdk: flutter
  flutter_syntax_view: ^4.1.7
  glob: ^2.1.3
  go_router: ^17.3.0
  http: ^1.3.0
  intl: ^0.20.2
  markdown: ^7.3.0
  package_info_plus: ^10.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.2.0
  shared_preferences: ^2.5.3
  simple_html_css: ^5.0.0
  stts: ^1.3.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  xml: ^7.0.1

dependency_overrides:
  # simple_html_css 5.0.0 requires xml ^6.5.0, but we can force it to 7
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/
    - assets/category_images/
