name: arcgis_maps_sdk_flutter_samples
description: "Sample code demonstrating the capabilities of ArcGIS Maps SDK for Flutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.12.1 <4.0.0'

dependencies:
  arcgis_maps: ^300.1.0
  arcgis_maps_toolkit: ^300.1.0
  async: ^2.12.0
  build: ^2.4.2
  build_config: ^1.1.2
  file_picker: ^12.0.0-beta.5
  flutter:
    sdk: flutter
  flutter_archive: 6.0.4
  flutter_localizations:
    sdk: flutter
  flutter_syntax_view: ^4.1.7
  flutter_tts: ^4.2.5
  glob: ^2.1.3
  go_router: ^16.1.0
  http: ^1.3.0
  intl: ^0.20.2
  markdown: ^7.3.0
  package_info_plus: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  shared_preferences: ^2.5.3
  simple_html_css: ^5.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  xml: ^7.0.1

dependency_overrides:
  # simple_html_css 5.0.0 requires xml ^6.5.0, but we can force it to 7
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/
    - assets/category_images/
